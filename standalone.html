  <style>
/* Autofeud — styles */
:root {
  --font: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bg: #f4f5fb; --bg2: #ffffff; --ink: #17182b; --muted: #6b6f8a; --line: #e4e6f2; --chip: #eef0f8;
  --card: #ffffff; --shadow: 0 1px 2px rgba(23, 24, 43, .06), 0 8px 28px rgba(23, 24, 43, .08);
  --brand: #7c5cff; --brand2: #ff4f9a; --brand3: #ff8a1f; --ok: #16b47a; --bad: #ff4757; --gold: #f5b400;
  --slot: #f1f2f9; --slot-ink: #9a9db8; --slot-found: linear-gradient(135deg, #7c5cff, #b04dff); --slot-ai: linear-gradient(135deg, #ff7a45, #ff4f9a); --slot-miss: #e9ebf5;
  --focus: 0 0 0 4px rgba(124, 92, 255, .25);
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f1d; --bg2: #16182b; --ink: #f2f3ff; --muted: #9da1c2; --line: #272a44; --chip: #20233b;
    --card: #17192d; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    --slot: #1e2138; --slot-ink: #6e7296; --slot-miss: #22253d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f1d; --bg2: #16182b; --ink: #f2f3ff; --muted: #9da1c2; --line: #272a44; --chip: #20233b;
  --card: #17192d; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  --slot: #1e2138; --slot-ink: #6e7296; --slot-miss: #22253d; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none; opacity: .55;
  background: radial-gradient(40% 35% at 15% 10%, rgba(124, 92, 255, .18), transparent 70%),
    radial-gradient(35% 30% at 90% 15%, rgba(255, 79, 154, .14), transparent 70%),
    radial-gradient(40% 35% at 70% 95%, rgba(255, 138, 31, .12), transparent 70%);
}
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- buttons ---------- */
.btn {
  border: 0; border-radius: 14px; padding: 12px 20px; font-size: 16px; font-weight: 700; letter-spacing: .01em;
  background: var(--chip); color: var(--ink); transition: transform .12s, box-shadow .12s, background .2s, opacity .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.primary { background: linear-gradient(135deg, var(--brand), #9b4dff); color: #fff; box-shadow: 0 6px 18px rgba(124, 92, 255, .35); }
.btn.hot { background: linear-gradient(135deg, var(--brand2), var(--brand3)); color: #fff; box-shadow: 0 6px 18px rgba(255, 79, 154, .3); }
.btn.big { font-size: 19px; padding: 15px 28px; border-radius: 16px; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow); font-size: 19px; display: grid; place-items: center; transition: transform .12s; }
.icon-btn:hover { transform: translateY(-1px); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; max-width: 1080px; margin: 0 auto; }
.topbar .grow { flex: 1; }
.profile { display: flex; align-items: center; gap: 10px; background: var(--card); box-shadow: var(--shadow); border: 0; border-radius: 16px; padding: 6px 14px 6px 6px; text-align: left; }
.avatar { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 800; background: linear-gradient(135deg, var(--brand), var(--brand2)); }
.profile b { display: block; font-size: 14px; line-height: 1.1; }
.profile small { color: var(--muted); font-size: 12px; font-weight: 600; }
.xpbar { height: 5px; width: 110px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand2)); border-radius: 99px; transition: width .8s ease; }

/* ---------- logo ---------- */
.logo { font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 0; user-select: none; }
.logo span:nth-child(1) { color: #7c5cff; } .logo span:nth-child(2) { color: #ff4f9a; } .logo span:nth-child(3) { color: #ff8a1f; }
.logo span:nth-child(4) { color: #f5b400; } .logo span:nth-child(5) { color: #16b47a; } .logo span:nth-child(6) { color: #2f8cff; }
.logo span:nth-child(7) { color: #ff4f9a; } .logo span:nth-child(8) { color: #7c5cff; }
.logo.huge { font-size: clamp(54px, 13vw, 104px); }
.logo.small { font-size: 26px; }

/* ---------- home ---------- */
.screen { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; }
.hero { text-align: center; padding: clamp(8px, 4vh, 40px) 0 10px; }
.tagline { margin: 10px 0 22px; color: var(--muted); font-size: clamp(16px, 2.4vw, 19px); font-weight: 500; }
.demo-search { max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 12px; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 14px 22px; font-size: 18px; text-align: left; border: 1px solid var(--line); }
.demo-search .q { flex: 1; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-search .q b { font-weight: 700; }
.caret { display: inline-block; width: 2px; height: 1.1em; background: var(--brand); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.demo-drop { max-width: 620px; margin: 6px auto 0; text-align: left; color: var(--muted); font-size: 15px; min-height: 104px; }
.demo-drop div { padding: 5px 22px 5px 56px; opacity: 0; transform: translateY(-4px); transition: all .25s; }
.demo-drop div.on { opacity: 1; transform: none; }
.demo-drop div b { color: var(--ink); }

.section-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 10px; }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mode {
  position: relative; text-align: left; border: 2px solid transparent; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
  padding: 16px; transition: transform .15s, border-color .15s; min-height: 132px; display: flex; flex-direction: column; gap: 4px;
}
.mode:hover { transform: translateY(-2px); }
.mode.sel { border-color: var(--brand); }
.mode .ic { font-size: 28px; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 6px; }
.mode b { font-size: 18px; }
.mode span { color: var(--muted); font-size: 14px; line-height: 1.35; }
.mode .badge { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.mode .badge.done { background: rgba(22, 180, 122, .15); color: var(--ok); }
.mode .badge.new { background: rgba(255, 79, 154, .15); color: var(--brand2); }

.setup { margin-top: 14px; background: var(--card); box-shadow: var(--shadow); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid transparent; background: var(--chip); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; transition: background .15s, border-color .15s; }
.chip.sel { border-color: var(--brand); background: rgba(124, 92, 255, .12); }
.setup-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.setup-row .lbl { font-weight: 800; font-size: 14px; color: var(--muted); }
#start { min-width: 200px; }

/* ---------- game ---------- */
.gamebar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.round-info { text-align: center; }
.round-info .cat { display: inline-flex; gap: 6px; align-items: center; font-weight: 800; font-size: 14px; padding: 4px 12px; border-radius: 99px; color: #fff; }
.round-info .rn { color: var(--muted); font-weight: 700; font-size: 14px; margin-top: 4px; }
.scorebox { text-align: right; }
.scorebox b { font-size: 28px; font-variant-numeric: tabular-nums; display: block; line-height: 1; }
.scorebox small { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }

.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 12px; }
.vs-card { background: var(--card); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; transition: border-color .2s, transform .2s; }
.vs-card.turn { border-color: var(--brand); transform: translateY(-2px); }
.vs-card.ai.turn { border-color: var(--brand2); }
.vs-card .avatar { flex: none; }
.vs-card .who { flex: 1; min-width: 0; }
.vs-card .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs-card .pts { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.vs-card .x { font-size: 12px; letter-spacing: 2px; color: var(--bad); min-height: 14px; }
.vs-mid { font-weight: 800; color: var(--muted); }
.ai-bubble { font-size: 13px; color: var(--muted); font-weight: 600; min-height: 16px; }

.search {
  margin: 16px auto 0; max-width: 760px; display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line);
  border-radius: 999px; padding: 6px 6px 6px 20px; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s;
}
.search:focus-within { border-color: var(--brand); box-shadow: var(--shadow), var(--focus); }
.search .mag { font-size: 18px; opacity: .6; }
.search label { display: flex; align-items: center; flex: 1; min-width: 0; gap: 6px; font-size: 19px; cursor: text; }
.search .qtext { font-weight: 700; white-space: nowrap; flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.search input { flex: 1; min-width: 60px; border: 0; outline: 0; background: transparent; font-size: 19px; padding: 10px 0; }
.search input::placeholder { color: var(--slot-ink); }
.search .btn { border-radius: 999px; padding: 12px 22px; }
.search.shake { animation: shake .4s; border-color: var(--bad); }
.search.good { border-color: var(--ok); }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

.status { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 12px 0 4px; min-height: 34px; flex-wrap: wrap; }
.strikes { display: flex; gap: 8px; }
.strike { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 17px; background: var(--chip); color: var(--slot-ink); transition: all .25s; }
.strike.on { background: var(--bad); color: #fff; transform: scale(1.1); box-shadow: 0 4px 12px rgba(255, 71, 87, .4); }
.timer { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 4px 14px; border-radius: 12px; background: var(--chip); }
.timer.low { background: var(--bad); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.feedback { font-weight: 700; color: var(--muted); font-size: 15px; min-height: 22px; text-align: center; transition: color .2s; }
.feedback.bad { color: var(--bad); } .feedback.ok { color: var(--ok); }

.board { max-width: 900px; margin: 10px auto 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(5, auto); gap: 10px 14px; perspective: 900px; }
.slot { position: relative; height: 58px; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, 1.4, .5, 1); }
.slot .face { position: absolute; inset: 0; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.slot .front { background: var(--slot); color: var(--slot-ink); }
.slot .back { background: var(--slot-found); color: #fff; transform: rotateX(180deg); box-shadow: 0 6px 18px rgba(124, 92, 255, .3); }
.slot.flip { transform: rotateX(180deg); }
.slot.by-ai .back { background: var(--slot-ai); box-shadow: 0 6px 18px rgba(255, 79, 154, .3); }
.slot.missed .back { background: var(--slot-miss); color: var(--muted); box-shadow: none; }
.slot .n { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: rgba(127, 127, 160, .14); }
.slot .back .n { background: rgba(255, 255, 255, .22); }
.slot.missed .back .n { background: rgba(127, 127, 160, .14); }
.slot .t { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .t i { font-style: normal; font-weight: 500; opacity: .75; }
.slot .p { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; opacity: .95; }
.slot .front .p { opacity: .7; }
.slot .hint { letter-spacing: .25em; font-weight: 800; color: var(--brand); }
.slot.pop { animation: slotpop .5s; }
@keyframes slotpop { 40% { filter: brightness(1.25); } }

.actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.round-banner {
  max-width: 760px; margin: 16px auto 0; background: var(--card); box-shadow: var(--shadow); border-radius: var(--radius); padding: 14px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; animation: rise .35s ease-out;
}
.round-banner b { font-size: 18px; }
.round-banner span { color: var(--muted); font-weight: 600; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.floater { position: fixed; z-index: 60; pointer-events: none; font-weight: 800; font-size: 22px; color: var(--ok); text-shadow: 0 2px 10px rgba(0, 0, 0, .15); animation: floatup 1.1s ease-out forwards; }
@keyframes floatup { from { opacity: 1; transform: translate(-50%, 0) scale(.9); } to { opacity: 0; transform: translate(-50%, -60px) scale(1.15); } }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10, 11, 25, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; padding: 16px; overflow-y: auto; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { margin: auto; width: min(560px, 100%); background: var(--card); border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); padding: 22px; position: relative; animation: rise .3s ease-out; }
.sheet h2 { margin: 0 0 12px; font-size: 26px; letter-spacing: -.02em; }
.sheet h3 { margin: 18px 0 8px; font-size: 16px; }
.sheet p, .sheet li { color: var(--muted); line-height: 1.5; }
.sheet .close { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--chip); font-size: 16px; }
.big-score { font-size: 54px; font-weight: 800; letter-spacing: -.03em; line-height: 1; background: linear-gradient(135deg, var(--brand), var(--brand2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result-head { text-align: center; }
.result-head .sub { color: var(--muted); font-weight: 700; margin-top: 6px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
.kpi { background: var(--chip); border-radius: 14px; padding: 10px 6px; text-align: center; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.levelup { display: flex; align-items: center; gap: 12px; background: var(--chip); border-radius: 14px; padding: 10px 14px; }
.levelup .xpbar { flex: 1; width: auto; height: 8px; }
.levelup b { white-space: nowrap; }
.ach-new { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.ach-new div { background: rgba(245, 180, 0, .14); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.round-list { display: grid; gap: 6px; margin-top: 8px; }
.round-list div { display: flex; justify-content: space-between; gap: 10px; background: var(--chip); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.round-list div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; background: var(--chip); border-radius: 14px; padding: 10px; opacity: .5; filter: grayscale(1); }
.ach.got { opacity: 1; filter: none; }
.ach .i { font-size: 24px; }
.ach b { display: block; font-size: 14px; }
.ach small { color: var(--muted); font-size: 12px; line-height: 1.3; display: block; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.set:last-of-type { border-bottom: 0; }
.seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 700; font-size: 14px; }
.seg button.sel { background: var(--card); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.switch { width: 48px; height: 28px; border-radius: 99px; background: var(--line); border: 0; position: relative; transition: background .2s; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch.on { background: var(--brand); }
.switch.on::after { transform: translateX(20px); }
.text-input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; background: var(--bg2); outline: 0; }
.text-input:focus { border-color: var(--brand); }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); animation: rise .25s; max-width: calc(100% - 32px); }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; font-weight: 500; }

@media (max-width: 860px) { .modes { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) {
  .board { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; gap: 8px; }
  .slot { height: 50px; }
  .slot .t { font-size: 16px; }
  .search { padding-left: 14px; }
  .search label, .search input { font-size: 17px; }
  .search .qtext { max-width: 55%; }
  .search .btn { padding: 11px 14px; }
  .search .btn .lbl { display: none; }
  .search .mag { display: none; }
  .scorebox b { font-size: 22px; }
  .mode { min-height: 0; padding: 12px; }
  .mode .ic { width: 38px; height: 38px; font-size: 22px; }
  .mode span { font-size: 13px; }
  .profile .xpbar { width: 70px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .ach-grid { grid-template-columns: 1fr; }
  .big-score { font-size: 44px; }
  .vs-card { padding: 8px 10px; gap: 8px; }
  .vs-card .pts { font-size: 18px; }
  #start { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }

      $('modes').addEventListener('click', e => { const m = e.target.closest('.mode'); if (m) { this.mode = m.dataset.mode; this.renderSetup(); } });
      $('modes').addEventListener('dblclick', e => { if (e.target.closest('.mode')) this.start(); });
      $('cats').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { this.cat = c.dataset.cat; this.renderSetup(); } });
      $('ai-levels').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { this.aiLevel = b.dataset.lvl; this.renderSetup(); } });
      $('start').addEventListener('click', () => this.start());
      $('search').addEventListener('submit', e => { e.preventDefault(); this.playerGuess(); });
      $('hint').addEventListener('click', () => this.useHint());
      $('pass').addEventListener('click', () => this.pass());
      $('next').addEventListener('click', () => this.nextRound());
      $('quit').addEventListener('click', () => this.confirmQuit());
      $('profile').addEventListener('click', () => this.open('settings'));
      document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => this.open(b.dataset.open)));
      $('modal').addEventListener('click', e => { if (e.target === $('modal') || e.target.closest('.close')) this.closeModal(); });
      addEventListener('keydown', e => {
        if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) this.closeModal();
        else if (e.key === 'Enter' && !$('banner').classList.contains('hidden') && $('modal').classList.contains('hidden') && document.activeElement !== $('guess')) { e.preventDefault(); this.nextRound(); }
      });
      $('guess').addEventListener('input', () => { if (this.g && this.g.turn !== 'ai') Sound.key(); });
    },

    /* ---------- game flow ---------- */
    start() {
      Sound.init();
      const M = MODES[this.mode], today = AF.today();
      const daily = this.mode === 'daily' ? today : null;
      const qs = AF.pickQuestions(this.mode === 'speed' ? 40 : M.rounds, daily ? null : this.cat, { daily, seen: this.p.seen });
      const [aiName, aiEmoji] = AF.AI_NAMES[Math.floor(Math.random() * AF.AI_NAMES.length)];
      this.token++;
      this.g = {
        mode: this.mode, M, qs, idx: -1, score: 0, hints: M.hints, hintsUsed: 0, streak: 0, maxStreak: 0, found: 0,
        rounds: [], practice: daily && this.dailyDone(), daily,
        me: { pts: 0, x: 0 }, ai: { pts: 0, x: 0, name: aiName, emoji: aiEmoji, level: this.aiLevel }, turn: 'me',
        time: M.time || 0, over: false
      };
      $('home').classList.add('hidden');
      $('game').classList.remove('hidden');
      $('mini-logo').classList.remove('hidden');
      $('versus').classList.toggle('hidden', this.mode !== 'versus');
      $('g-scorebox').classList.toggle('hidden', this.mode === 'versus');
      $('timer').classList.toggle('hidden', this.mode !== 'speed');
      $('strikes').classList.toggle('hidden', this.mode === 'speed' || this.mode === 'versus');
      $('pass').textContent = this.mode === 'speed' ? 'Skip ▸' : 'Give up';
      if (this.mode === 'versus') {
        const name = this.p.name || 'You';
        $('vs-me-name').textContent = name; $('vs-me-av').textContent = name[0].toUpperCase();
        $('vs-ai-name').textContent = aiName + ' · ' + AF.AI_LEVELS[this.aiLevel].name; $('vs-ai-av').textContent = aiEmoji;
      }
      if (this.mode === 'speed') this.startTimer();
      scrollTo(0, 0);
      this.nextRound();
    },

    startTimer() {
      const tok = this.token;
      let last = performance.now(), lastSec = -1;
      const loop = now => {
        if (tok !== this.token || !this.g || this.g.over) return;
        if ($('modal').classList.contains('hidden') || this.g.inResults) this.g.time -= (now - last) / 1000;
        last = now;
        const s = Math.max(0, Math.ceil(this.g.time));
        $('timer').textContent = s;
        $('timer').classList.toggle('low', s <= 10);
        if (s <= 10 && s !== lastSec && s > 0) Sound.tick();
        lastSec = s;
        if (this.g.time <= 0) { this.endRound('time'); return; }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    },

    nextRound() {
      const g = this.g;
      if (!g) return;
      $('banner').classList.add('hidden');
      g.idx++;
      if (g.mode !== 'speed' && g.idx >= g.M.rounds) { this.finish(); return; }
      if (g.idx >= g.qs.length) g.qs.push(...AF.pickQuestions(10, this.cat, {}));
      const q = g.qs[g.idx];
      g.round = { q, revealed: {}, by: {}, hinted: {}, strikes: 0, tried: new Set(), over: false, points: 0, foundMe: 0 };
      g.me.x = 0; g.ai.x = 0;
      g.turn = g.mode === 'versus' && g.idx % 2 === 1 ? 'ai' : 'me';
      const c = catOf(q.cat);
      $('g-cat').innerHTML = c.icon + ' ' + c.name;
      $('g-cat').style.background = c.color;
      $('g-round').textContent = g.mode === 'speed' ? 'Search ' + (g.idx + 1) : 'Round ' + (g.idx + 1) + ' of ' + g.M.rounds + (g.practice ? ' · practice' : '');
      $('g-query').textContent = q.query;
      $('guess').value = '';
      $('feedback').textContent = g.mode === 'versus' ? '' : 'Finish the search. Type what comes next.';
      $('feedback').className = 'feedback';
      $('board').innerHTML = q.answers.map(a => `<div class="slot" data-r="${a.rank}"><div class="face front"><span class="n">${a.rank + 1}</span><span class="t"></span><span class="p">${fmt(a.points)}</span></div><div class="face back"><span class="n">${a.rank + 1}</span><span class="t"><i>${esc(q.query)}</i> ${esc(a.text)}</span><span class="p"></span></div></div>`).join('');
      $('actions').classList.remove('hidden');
      this.renderStrikes();
      this.renderHint();
      this.renderScore();
      this.setTurn(g.turn);
    },

    setTurn(who) {
      const g = this.g;
      g.turn = who;
      const mine = who === 'me' && !g.round.over;
      $('guess').disabled = !mine; $('go').disabled = !mine;
      $('hint').disabled = !mine || g.hints <= 0;
      $('pass').disabled = !mine;
      if (g.mode === 'versus') {
        $('vs-me').classList.toggle('turn', who === 'me' && !g.round.over);
        $('vs-ai').classList.toggle('turn', who === 'ai' && !g.round.over);
        $('guess').placeholder = who === 'me' ? 'your turn…' : '';
      } else $('guess').placeholder = '…';
      if (mine) setTimeout(() => { if (!$('guess').disabled && $('modal').classList.contains('hidden')) $('guess').focus({ preventScroll: true }); }, 30);
      if (who === 'ai' && !g.round.over) this.aiTurn();
    },

    playerGuess() {
      const g = this.g;
      if (!g || g.round.over || g.turn !== 'me') return;
      const text = $('guess').value.trim();
      if (!text) return;
      $('guess').value = '';
      this.judge(text, 'me');
    },

    async aiTurn() {
      const g = this.g, tok = this.token, rnd = g.round;
      const say = t => { $('vs-ai-say').textContent = t; };
      say(AF.AI_LINES.think[Math.floor(Math.random() * AF.AI_LINES.think.length)]);
      const pick = AF.aiGuess(rnd.q, rnd.revealed, rnd.tried, g.ai.level);
      await wait(pick.think * 1000);
      if (tok !== this.token || rnd !== g.round || rnd.over) return;
      const input = $('guess');
      input.value = '';
      for (const ch of pick.text) {
        input.value += ch;
        Sound.key();
        await wait(70 + Math.random() * 90);
        if (tok !== this.token || rnd !== g.round) return;
      }
      await wait(280);
      if (tok !== this.token || rnd !== g.round || rnd.over) return;
      input.value = '';
      this.judge(pick.text, 'ai');
    },

    judge(text, who) {
      const g = this.g, r = g.round, q = r.q;
      r.tried.add(text.toLowerCase());
      const m = AF.match(q, text, r.revealed);
      const fb = $('feedback');
      if (m.answer) {
        const a = m.answer, pts = r.hinted[a.rank] ? a.points / 2 : a.points;
        r.revealed[a.rank] = who; r.by[a.rank] = who;
        this.flip(a.rank, who, pts);
        if (who === 'me') {
          g.streak++; g.maxStreak = Math.max(g.maxStreak, g.streak); g.found++; r.foundMe++;
          if (g.mode === 'versus') g.me.pts += pts; else g.score += pts;
          r.points += pts;
          if (g.mode === 'speed') g.time += 3;
          Sound.hit(a.rank);
          fb.textContent = a.rank === 0 ? '#1 answer! +' + fmt(pts) : 'Nice! +' + fmt(pts);
        } else {
          g.ai.pts += pts;
          Sound.aiHit();
          $('vs-ai-say').textContent = AF.AI_LINES.hit[Math.floor(Math.random() * AF.AI_LINES.hit.length)];
          fb.textContent = g.ai.name + ' found “' + a.text + '” +' + fmt(pts);
        }
        fb.className = 'feedback ok';
        $('search').classList.remove('shake'); $('search').classList.add('good');
        setTimeout(() => $('search').classList.remove('good'), 500);
        this.announce((who === 'me' ? 'Correct: ' : g.ai.name + ' found: ') + a.text);
        this.renderScore();
        if (Object.keys(r.revealed).length === 10) { this.endRound('clear'); return; }
        if (who === 'ai') this.setTurn('ai');
        else this.renderHint();
        return;
      }
      if (m.dupe) {
        Sound.dupe();
        fb.textContent = '“' + m.dupe.text + '” is already on the board.';
        fb.className = 'feedback';
        if (who === 'ai') this.setTurn('ai');
        return;
      }
      // miss
      Sound.miss();
      const s = $('search');
      s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
      fb.textContent = '“' + text + '” is not in the top 10.';
      fb.className = 'feedback bad';
      this.announce('Not on the board');
      if (who === 'me') g.streak = 0;
      if (g.mode === 'speed') return;
      if (g.mode === 'versus') {
        const side = g[who], other = who === 'me' ? 'ai' : 'me';
        side.x++;
        if (who === 'ai') $('vs-ai-say').textContent = AF.AI_LINES.miss[Math.floor(Math.random() * AF.AI_LINES.miss.length)];
        this.renderStrikes();
        if (g[other].x < g.M.strikes) this.setTurn(other);
        else if (side.x < g.M.strikes) this.setTurn(who);
        else this.endRound('strikes');
        return;
      }
      r.strikes++;
      this.renderStrikes();
      if (r.strikes >= g.M.strikes) this.endRound('strikes');
    },

    flip(rank, who, pts) {
      const el = $('board').querySelector(`.slot[data-r="${rank}"]`);
      if (!el) return;
      el.querySelector('.back .p').textContent = pts ? fmt(pts) : '';
      el.classList.add('flip');
      if (who === 'ai') el.classList.add('by-ai');
      if (who === 'miss') el.classList.add('missed');
      else {
        el.classList.add('pop');
        const b = el.getBoundingClientRect();
        const f = document.createElement('div');
        f.className = 'floater';
        f.textContent = '+' + fmt(pts);
        if (who === 'ai') f.style.color = 'var(--brand2)';
        f.style.left = (b.left + b.width / 2) + 'px'; f.style.top = (b.top - 6) + 'px';
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 1200);
        if (rank === 0 && who === 'me') Confetti.burst(40, b.left + b.width / 2, b.top);
      }
    },

    async endRound(why) {
      const g = this.g, r = g.round;
      if (r.over) return;
      r.over = true;
      this.setTurn(g.turn);
      $('actions').classList.add('hidden');
      const tok = this.token;
      const all = Object.keys(r.revealed).length === 10;
      g.rounds.push({ q: r.q, found: Object.keys(r.by).filter(k => r.by[k] === 'me').map(Number), ai: Object.keys(r.by).filter(k => r.by[k] === 'ai').map(Number), points: r.points, all });
      const st = this.p.stats;
      st.cats[r.q.cat] = (st.cats[r.q.cat] || 0) + 1;
      if (!this.p.seen.includes(r.q.id)) { this.p.seen.push(r.q.id); if (this.p.seen.length > 50) this.p.seen.shift(); }
      if (all && r.foundMe === 10) { Sound.clear(); Confetti.burst(140); }
      if (g.mode === 'versus') { $('vs-me').classList.remove('turn'); $('vs-ai').classList.remove('turn'); }
      const fb = $('feedback');
      if (why === 'strikes') { fb.textContent = g.mode === 'versus' ? 'Both sides struck out!' : 'Three strikes! Here is the full list.'; fb.className = 'feedback bad'; }
      else if (why === 'clear') { fb.textContent = all && r.foundMe === 10 ? 'Perfect board! 🎉' : 'Board cleared!'; fb.className = 'feedback ok'; }
      else if (why === 'time') { fb.textContent = 'Time!'; fb.className = 'feedback bad'; }
      else { fb.textContent = 'Here is the full list.'; fb.className = 'feedback'; }
      // reveal what was missed
      for (const a of r.q.answers) {
        if (r.revealed[a.rank]) continue;
        r.revealed[a.rank] = 'miss';
        this.flip(a.rank, 'miss', 0);
        Sound.flip();
        await wait(g.mode === 'speed' ? 60 : 140);
        if (tok !== this.token) return;
      }
      if (g.mode === 'speed') {
        if (why === 'time') { await wait(900); if (tok === this.token) this.finish(); }
        else { await wait(why === 'clear' ? 900 : 650); if (tok === this.token) this.nextRound(); }
        return;
      }
      const last = g.idx + 1 >= g.M.rounds;
      const mine = g.rounds[g.rounds.length - 1].found.length;
      $('banner-title').textContent = g.mode === 'versus'
        ? `You ${fmt(g.me.pts)} – ${fmt(g.ai.pts)} ${g.ai.name}`
        : `${mine}/10 found · +${fmt(r.points)}`;
      $('banner-sub').textContent = last ? 'That was the last round.' : 'Round ' + (g.idx + 2) + ' is next.';
      $('next').textContent = last ? 'See results ▸' : 'Next round ▸';
      $('banner').classList.remove('hidden');
      $('next').focus({ preventScroll: true });
    },

    pass() {
      const g = this.g;
      if (!g || g.round.over || g.turn !== 'me') return;
      if (g.mode === 'versus') { g.me.x = g.M.strikes; this.renderStrikes(); if (g.ai.x < g.M.strikes) this.setTurn('ai'); else this.endRound('pass'); return; }
      this.endRound('pass');
    },

    useHint() {
      const g = this.g;
      if (!g || g.hints <= 0 || g.round.over || g.turn !== 'me') return;
      const a = g.round.q.answers.find(x => !g.round.revealed[x.rank] && !g.round.hinted[x.rank]);
      if (!a) return;
      g.hints--; g.hintsUsed++;
      g.round.hinted[a.rank] = true;
      const masked = a.text.split(' ').map(w => w[0] + '•'.repeat(Math.max(0, w.length - 1))).join(' ');
      const el = $('board').querySelector(`.slot[data-r="${a.rank}"] .front`);
      el.querySelector('.t').innerHTML = `<span class="hint">${esc(masked)}</span>`;
      el.querySelector('.p').textContent = fmt(a.points / 2);
      Sound.hint();
      $('feedback').textContent = 'Hint: answer #' + (a.rank + 1) + ' is now worth half.';
      $('feedback').className = 'feedback';
      this.renderHint();
      $('guess').focus({ preventScroll: true });
    },

    renderHint() {
      const g = this.g;
      $('hint-n').textContent = '(' + g.hints + ')';
      $('hint').disabled = g.hints <= 0 || g.round.over || g.turn !== 'me';
    },
    renderStrikes() {
      const g = this.g;
      if (g.mode === 'versus') {
        $('vs-me-x').textContent = '✕'.repeat(g.me.x);
        $('vs-ai-x').textContent = '✕'.repeat(g.ai.x);
        return;
      }
      const n = g.round ? g.round.strikes : 0;
      $('strikes').innerHTML = Array.from({ length: g.M.strikes }, (_, i) => `<span class="strike${i < n ? ' on' : ''}">✕</span>`).join('');
    },
    renderScore() {
      const g = this.g;
      $('g-score').textContent = fmt(g.score);
      $('vs-me-pts').textContent = fmt(g.me.pts);
      $('vs-ai-pts').textContent = fmt(g.ai.pts);
    },

    /* ---------- results ---------- */
    finish() {
      const g = this.g, p = this.p, st = p.stats;
      g.over = true; g.inResults = true;
      const score = g.mode === 'versus' ? g.me.pts : g.score;
      const lvlBefore = AF.levelOf(p.xp);
      let xp = Math.round(score / 100);
      let outcome = '';
      if (g.mode === 'versus') {
        if (g.me.pts > g.ai.pts) { outcome = 'win'; st.wins++; xp += 100; }
        else if (g.me.pts < g.ai.pts) { outcome = 'lose'; st.losses++; }
        else outcome = 'draw';
      }
      if (g.practice) xp = Math.round(xp / 4);
      p.xp += xp;
      st.games++;
      st.rounds += g.rounds.length;
      st.found += g.found;
      st.perfect += g.rounds.filter(r => r.found.length === 10).length;
      st.tops += g.rounds.filter(r => r.found.includes(0)).length;
      st.deep += g.rounds.filter(r => r.found.includes(9)).length;
      st.bestRun = Math.max(st.bestRun, g.maxStreak);
      const prevBest = st.best[g.mode] || 0;
      if (!g.practice) st.best[g.mode] = Math.max(prevBest, score);
      if (g.mode === 'speed') st.speedBest = Math.max(st.speedBest, g.found);
      if (g.mode === 'daily' && !g.practice) {
        const d = p.daily, y = new Date(); y.setDate(y.getDate() - 1);
        const yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
        d.streak = d.last === yk ? d.streak + 1 : 1;
        d.last = g.daily;
        d.history[g.daily] = { score, rounds: g.rounds.map(r => r.found) };
      }
      // achievements
      const got = [];
      const award = (id, cond) => { if (cond && !p.ach[id]) { p.ach[id] = Date.now(); got.push(AF.ACHIEVEMENTS.find(a => a.id === id)); } };
      award('first', true);
      award('perfect', g.rounds.some(r => r.found.length === 10));
      award('streak5', g.maxStreak >= 5);
      award('mind', g.mode !== 'speed' && g.rounds.length >= 5 && g.rounds.every(r => r.found.includes(0)));
      award('deep', st.deep >= 10);
      award('k50', g.mode === 'classic' && score >= 50000);
      award('nohint', g.mode === 'classic' && g.hintsUsed === 0 && score >= 30000);
      award('rival', outcome === 'win');
      award('buster', outcome === 'win' && g.ai.level === 'hard');
      award('speed20', g.mode === 'speed' && g.found >= 20);
      award('daily3', p.daily.streak >= 3);
      award('explorer', AF.CATEGORIES.every(c => st.cats[c.id]));
      this.save();
      this.renderProfile();
      this.refreshDaily();

      const lvl = AF.levelOf(p.xp), a = AF.xpFor(lvl), b = AF.xpFor(lvl + 1);
      const title = g.mode === 'versus' ? (outcome === 'win' ? 'You win! 🏆' : outcome === 'lose' ? g.ai.name + ' wins' : 'It\'s a draw!')
        : g.mode === 'speed' ? 'Time\'s up!' : g.mode === 'daily' ? 'Daily complete!' : 'Game over';
      const newBest = !g.practice && score > prevBest && prevBest > 0;
      if (outcome === 'lose') Sound.lose(); else { Sound.win(); Confetti.burst(outcome === 'win' || newBest ? 180 : 90); }
      const rounds = g.rounds.slice(0, g.mode === 'speed' ? 8 : 5).map(r => `<div><span>${esc(r.q.query)}…</span><span>${r.found.length}/10${g.mode === 'versus' ? ' · AI ' + r.ai.length : ''}</span></div>`).join('');
      this.showModal(`
        <div class="result-head">
          <h2>${title}</h2>
          <div class="big-score">${fmt(score)}</div>
          <div class="sub">${g.mode === 'versus' ? 'vs ' + esc(g.ai.name) + ' ' + fmt(g.ai.pts) + ' · ' : ''}${newBest ? '🎉 New personal best! · ' : ''}${g.practice ? 'Practice run · ' : ''}${MODES[g.mode].name}</div>
        </div>
        <div class="kpis">
          <div class="kpi"><b>${g.found}</b><span>Found</span></div>
          <div class="kpi"><b>${g.rounds.filter(r => r.found.includes(0)).length}</b><span>#1 hits</span></div>
          <div class="kpi"><b>${g.maxStreak}</b><span>Best run</span></div>
          <div class="kpi"><b>+${xp}</b><span>XP</span></div>
        </div>
        <div class="levelup"><b>Lv ${lvl}</b><span class="xpbar"><i style="width:${Math.round((p.xp - a) / (b - a) * 100)}%"></i></span><b>${lvl > lvlBefore ? '⬆ Level up!' : AF.titleOf(lvl)}</b></div>
        ${got.length ? '<div class="ach-new">' + got.map(x => `<div>${x.icon} Achievement unlocked: ${x.name}</div>`).join('') + '</div>' : ''}
        <h3>Rounds</h3><div class="round-list">${rounds}</div>
        <div class="row-btns">
          ${g.mode === 'daily' ? '<button class="btn hot" id="share">📋 Share result</button>' : ''}
          <button class="btn primary" id="again">Play again</button>
          <button class="btn ghost" id="home-btn">Menu</button>
        </div>`, () => this.toHome());
      $('again').onclick = () => { this.closeModal(true); this.start(); };
      $('home-btn').onclick = () => this.closeModal();
      if ($('share')) $('share').onclick = () => this.share(score);
    },

    share(score) {
      const g = this.g;
      const lines = g.rounds.map(r => Array.from({ length: 10 }, (_, i) => r.found.includes(i) ? '🟪' : '⬜').join(''));
      const text = `Autofeud Daily ${g.daily}\n🔎 ${fmt(score)} pts\n${lines.join('\n')}` + (/^https?:/.test(location.href) ? '\n' + location.href.split('#')[0] : '');
      const done = () => this.toast('Copied! Paste it anywhere.');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => this.copyFallback(text, done));
      else this.copyFallback(text, done);
    },
    copyFallback(text, done) {
      const t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { this.toast('Could not copy'); }
      t.remove();
    },

    toHome() {
      this.token++;
      this.g = null;
      $('game').classList.add('hidden');
      $('home').classList.remove('hidden');
      $('mini-logo').classList.add('hidden');
      this.renderSetup();
      scrollTo(0, 0);
    },

    confirmQuit() {
      const g = this.g;
      if (!g || g.over) { this.toHome(); return; }
      this.showModal(`<h2>Leave this game?</h2><p>Your score for this game will not be saved.</p>
        <div class="row-btns"><button class="btn primary" id="stay">Keep playing</button><button class="btn ghost" id="leave">Leave</button></div>`);
      $('stay').onclick = () => this.closeModal();
      $('leave').onclick = () => { this.closeModal(true); this.toHome(); };
    },

    /* ---------- modals ---------- */
    showModal(html, onClose) {
      $('modal-body').innerHTML = html;
      $('modal').classList.remove('hidden');
      this.onClose = onClose || null;
      const f = $('modal').querySelector('.row-btns .btn, input');
      if (f) setTimeout(() => f.focus({ preventScroll: true }), 50);
    },
    closeModal(silent) {
      $('modal').classList.add('hidden');
      const cb = this.onClose; this.onClose = null;
      if (cb && !silent) cb();
      if (this.g && !this.g.over && this.g.turn === 'me' && !this.g.round.over) $('guess').focus({ preventScroll: true });
    },
    open(which) {
      if (which === 'help') this.showModal(`
        <h2>How to play</h2>
        <p>A search is cut off, like <b>why do cats …</b>. Guess the 10 most popular ways to finish it.</p>
        <ul>
          <li>Type only what comes next: <b>purr</b> counts for “why do cats purr”.</li>
          <li>Small typos and plurals are fine. One key word is enough.</li>
          <li>Answer #1 is worth 10,000 points, #10 is worth 1,000.</li>
          <li>A wrong guess is a strike. Three strikes end the round.</li>
          <li>💡 Hints show the first letters of the best hidden answer, which then scores half.</li>
        </ul>
        <h3>Modes</h3>
        <ul>
          <li><b>Classic</b>: 5 searches from the category you pick.</li>
          <li><b>Daily Challenge</b>: everyone gets the same 5 searches today. Share your result.</li>
          <li><b>Versus AI</b>: take turns. A hit keeps your turn, a miss passes it. Three misses and you are out for the round.</li>
          <li><b>Speed Rush</b>: 60 seconds, no strikes, every hit adds 3 seconds.</li>
        </ul>
        <p>All searches are written for this game and kept school friendly.</p>`);
      else if (which === 'stats') {
        const p = this.p, s = p.stats, lvl = AF.levelOf(p.xp);
        this.showModal(`
          <h2>Stats</h2>
          <div class="levelup"><b>Lv ${lvl} · ${AF.titleOf(lvl)}</b><span class="xpbar"><i style="width:${Math.round((p.xp - AF.xpFor(lvl)) / (AF.xpFor(lvl + 1) - AF.xpFor(lvl)) * 100)}%"></i></span><b>${fmt(p.xp)} XP</b></div>
          <div class="kpis">
            <div class="kpi"><b>${s.games}</b><span>Games</span></div>
            <div class="kpi"><b>${fmt(s.found)}</b><span>Found</span></div>
            <div class="kpi"><b>${s.perfect}</b><span>Perfect</span></div>
            <div class="kpi"><b>${s.wins}–${s.losses}</b><span>vs AI</span></div>
            <div class="kpi"><b>${fmt(s.best.classic)}</b><span>Best classic</span></div>
            <div class="kpi"><b>${fmt(s.best.daily)}</b><span>Best daily</span></div>
            <div class="kpi"><b>${s.speedBest}</b><span>Best rush</span></div>
            <div class="kpi"><b>${p.daily.streak}</b><span>Daily streak</span></div>
          </div>
          <h3>Achievements · ${Object.keys(p.ach).length}/${AF.ACHIEVEMENTS.length}</h3>
          <div class="ach-grid">${AF.ACHIEVEMENTS.map(a => `<div class="ach${p.ach[a.id] ? ' got' : ''}"><span class="i">${a.icon}</span><span><b>${a.name}</b><small>${a.desc}</small></span></div>`).join('')}</div>`);
      } else if (which === 'settings') {
        const s = this.p.settings;
        this.showModal(`
          <h2>Settings</h2>
          <div class="set" style="display:block"><div style="margin-bottom:8px">Your name</div><input id="set-name" class="text-input" maxlength="16" placeholder="Player" value="${esc(this.p.name)}"></div>
          <div class="set">Sound<button class="switch${s.sound ? ' on' : ''}" id="set-sound" aria-label="Sound"></button></div>
          <div class="set">Animations<button class="switch${s.motion ? ' on' : ''}" id="set-motion" aria-label="Animations"></button></div>
          <div class="set">Theme<div class="seg" id="set-theme">${['auto', 'light', 'dark'].map(t => `<button data-t="${t}" class="${s.theme === t ? 'sel' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
          <div class="set">Progress<button class="btn ghost" id="set-reset">Reset all progress</button></div>`);
        $('set-name').addEventListener('input', e => { this.p.name = e.target.value.trim().slice(0, 16); this.save(); this.renderProfile(); });
        $('set-sound').onclick = e => { s.sound = !s.sound; Sound.on = s.sound; e.currentTarget.classList.toggle('on', s.sound); this.save(); };
        $('set-motion').onclick = e => { s.motion = !s.motion; e.currentTarget.classList.toggle('on', s.motion); this.applyTheme(); this.save(); };
        $('set-theme').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.theme = b.dataset.t; this.applyTheme(); this.save(); $('set-theme').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); };
        let armed = false;
        $('set-reset').onclick = e => {
          if (!armed) { armed = true; e.currentTarget.textContent = 'Tap again to confirm'; return; }
          this.p = AF.Store.reset(); this.save(); this.applyTheme(); Sound.on = true; this.renderProfile(); this.refreshDaily(); this.renderSetup(); this.closeModal(); this.toast('Progress reset');
        };
      }
    },

    toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    },
    announce(msg) { $('announce').textContent = msg; }
  };

  AF.App = App;
  AF.Sound = Sound;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
  else App.boot();
})(window.AF = window.AF || {});
</script>
</body>
</html>
